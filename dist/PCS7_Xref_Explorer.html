<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PCS7 Xref Explorer</title>
<style>:root{
  --bg:#f4f5f7; --panel:#ffffff; --panel2:#f9fafb; --line:#dfe3e8; --line2:#eef0f3;
  --text:#1d2330; --muted:#677184; --accent:#0b62c4; --accent-bg:#e7f0fb;
  --ok:#1a7f37; --ok-bg:#e6f4ea; --warn:#9a6700; --warn-bg:#fff4d6; --err:#c62828; --err-bg:#fdecec; --info-bg:#eef1f5;
  --edge:#8a94a6; --edge-hi:#0b62c4; --edge-dead:#c77700;
  --c-tech:#2f6db5; --c-drv:#2e8540; --c-logic:#7b8494; --c-sfc:#8a3fb8; --c-chart:#b06d00; --c-addr:#0f8a8a; --c-ext:#a0a7b4;
  --node:#ffffff; --node-head:#f1f4f8;
  --mono: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181d; --panel:#1d2128; --panel2:#22272f; --line:#323843; --line2:#2a2f38;
    --text:#e3e7ee; --muted:#98a2b3; --accent:#5aa2f0; --accent-bg:#1f3350;
    --ok:#5cc97a; --ok-bg:#1d3324; --warn:#e3b341; --warn-bg:#3a3018; --err:#ff7b72; --err-bg:#3d1f1f; --info-bg:#262b33;
    --edge:#6c7688; --edge-hi:#5aa2f0; --edge-dead:#e0a040;
    --c-tech:#5a9be6; --c-drv:#57b56a; --c-logic:#8d96a6; --c-sfc:#b67be0; --c-chart:#e0a040; --c-addr:#3cc0c0; --c-ext:#5d6573;
    --node:#232830; --node-head:#2b313b;
  }
}
:root[data-theme="dark"]{
    --bg:#15181d; --panel:#1d2128; --panel2:#22272f; --line:#323843; --line2:#2a2f38;
    --text:#e3e7ee; --muted:#98a2b3; --accent:#5aa2f0; --accent-bg:#1f3350;
    --ok:#5cc97a; --ok-bg:#1d3324; --warn:#e3b341; --warn-bg:#3a3018; --err:#ff7b72; --err-bg:#3d1f1f; --info-bg:#262b33;
    --edge:#6c7688; --edge-hi:#5aa2f0; --edge-dead:#e0a040;
    --c-tech:#5a9be6; --c-drv:#57b56a; --c-logic:#8d96a6; --c-sfc:#b67be0; --c-chart:#e0a040; --c-addr:#3cc0c0; --c-ext:#5d6573;
    --node:#232830; --node-head:#2b313b;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;overflow:hidden}
a.lnk{color:var(--accent);cursor:pointer;text-decoration:none}
a.lnk:hover{text-decoration:underline}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
input[type=text],input[type=search],select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0}
input:focus,select:focus{outline:2px solid var(--accent-bg);border-color:var(--accent)}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted)}
.ico{width:16px;height:16px;image-rendering:pixelated;vertical-align:-3px;flex:none}
.ico.big{width:32px;height:32px}

#app{display:grid;grid-template-rows:48px 1fr;height:100vh}
header{display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0 8px 0 0;white-space:nowrap;font-weight:600}
header h1 span{color:var(--muted);font-weight:400}
#fileChips{display:flex;gap:4px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border-radius:5px;border:1px solid var(--line);background:var(--panel2);font-size:11px;cursor:pointer}
.chip.off{opacity:.38;filter:grayscale(1)}
#gsearch{flex:1;max-width:520px}
.navbtn{padding:3px 8px}
#body{display:grid;grid-template-columns:var(--sbw,330px) 5px 1fr;min-height:0}
#split{cursor:col-resize;background:var(--line2)}
#split:hover{background:var(--accent)}
aside{background:var(--panel);display:flex;flex-direction:column;min-height:0}
.stabs,.mtabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);background:var(--panel)}
.stabs button,.mtabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;padding:6px 10px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.stabs button.on,.mtabs button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.sfilter{display:flex;gap:6px;padding:8px}
.sfilter input{flex:1}
#side{flex:1;overflow:auto;padding:0 4px 20px}
.tn{display:flex;align-items:center;gap:4px;padding:2px 4px;border-radius:4px;cursor:pointer;white-space:nowrap}
.tn:hover{background:var(--panel2)}
.tn.sel{background:var(--accent-bg)}
.tn .tw{width:14px;text-align:center;color:var(--muted);flex:none;font-size:10px}
.tn .cnt{margin-left:auto;color:var(--muted);font-size:11px;padding-left:8px}
.tn .ty{color:var(--muted);font-size:11px}
.tc{padding-left:14px}
.gico{width:14px;height:14px;flex:none;display:inline-block;vertical-align:-2px}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
#view{flex:1;overflow:auto;position:relative;min-height:0}
.pad{padding:14px 18px}
.crumb{display:flex;flex-wrap:wrap;gap:4px;align-items:center;color:var(--muted);font-size:12px;margin-bottom:6px}
.crumb a{color:var(--accent);cursor:pointer}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.card h2{margin:0 0 4px;font-size:18px}
.card h3{margin:0 0 8px;font-size:14px}
.pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;background:var(--info-bg);border:1px solid var(--line);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.err{background:var(--err-bg);color:var(--err);border-color:transparent}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:2px 12px;font-size:12px}
.kv b{color:var(--muted);font-weight:500}
table.t{border-collapse:collapse;width:100%;font-size:12px}
table.t th{position:sticky;top:0;background:var(--panel2);text-align:left;font-weight:600;border-bottom:1px solid var(--line);padding:5px 8px;white-space:nowrap;z-index:1}
table.t td{border-bottom:1px solid var(--line2);padding:4px 8px;vertical-align:top}
table.t tr:hover td{background:var(--panel2)}
table.t td.nw{white-space:nowrap}
.tablewrap{max-height:none;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.stat{display:inline-flex;flex-direction:column;padding:6px 14px;border-left:3px solid var(--line);min-width:110px}
.stat b{font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted)}
.stat.err{border-color:var(--err)} .stat.warn{border-color:var(--warn)} .stat.ok{border-color:var(--ok)}
details.uses summary{cursor:pointer;color:var(--muted)}
details.uses div{font-family:var(--mono);font-size:11px;padding-left:12px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.toolbar label{display:inline-flex;gap:4px;align-items:center;color:var(--muted)}
.gwrap{position:relative;flex:1;min-height:300px;overflow:hidden;background:var(--bg);
  background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:20px 20px}
.gwrap svg{width:100%;height:100%;display:block;cursor:grab;user-select:none}
.gwrap svg.drag{cursor:grabbing}
.gctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.gctl button{width:30px;height:30px;padding:0;background:var(--panel)}
.ghint{position:absolute;left:10px;bottom:8px;font-size:11px;color:var(--muted);background:var(--panel);padding:2px 8px;border-radius:6px;border:1px solid var(--line);opacity:.9}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.fullv{display:flex;flex-direction:column;height:100%}
/* graph */
.edge{fill:none;stroke:var(--edge);stroke-width:1.2;opacity:.75}
.edge.dead{stroke-dasharray:5 3}
.edge.hi{stroke:var(--edge-hi);stroke-width:2.4;opacity:1}
.edge.dim{opacity:.15}
.edge.sfc{stroke:var(--c-sfc);stroke-dasharray:2 3}
.edge.addr{stroke:var(--c-addr)}
.node rect.b{fill:var(--node);stroke:var(--line);stroke-width:1}
.node rect.h{stroke:none}
.node text{fill:var(--text);font-size:11px;font-family:"Segoe UI",system-ui,Arial,sans-serif}
.node text.t{font-weight:600;font-size:12px}
.node text.s{fill:var(--muted);font-size:10px}
.node text.p{font-size:10.5px;font-family:var(--mono)}
.node line.pl{stroke:var(--muted);stroke-width:1}
.node{cursor:pointer}
.node.focus rect.b{stroke:var(--accent);stroke-width:2.5}
.node.hi rect.b{stroke:var(--edge-hi);stroke-width:2}
.node.dim{opacity:.35}
.node.ext rect.b{stroke-dasharray:4 3;fill:var(--panel2)}
.node.addr rect.b{fill:var(--panel2)}
.etext{fill:var(--muted);font-size:10px}
/* files */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.fcard{display:flex;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
.fcard.on{border-color:var(--ok);box-shadow:inset 3px 0 0 var(--ok)}
.fcard h4{margin:0 0 2px;font-size:13px}
.fcard p{margin:2px 0;font-size:12px;color:var(--muted)}
.fcard .st{font-size:12px;margin-top:6px}
#drop{border:2px dashed var(--line);border-radius:10px;padding:24px;text-align:center;margin-bottom:16px;background:var(--panel)}
#drop.over{border-color:var(--accent);background:var(--accent-bg)}
#dragmask{position:fixed;inset:0;background:rgba(11,98,196,.12);border:4px dashed var(--accent);display:none;z-index:50;align-items:center;justify-content:center;font-size:22px;color:var(--accent);pointer-events:none}
#dragmask.on{display:flex}
#toast{position:fixed;right:16px;bottom:16px;background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;z-index:60;max-width:420px}
.need{margin:30px auto;max-width:520px;text-align:center;color:var(--muted)}
.need .ico{margin:0 2px}
.flex1{flex:1}
.sfcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.sfccard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.sfccard:hover{border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:none;border-radius:0;border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
mark{background:#ffe58a;color:inherit;padding:0}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .ico{background:#e9e9e9;border-radius:3px;padding:1px} }
:root[data-theme="dark"] .ico{background:#e9e9e9;border-radius:3px;padding:1px}

.strip{display:inline-flex;flex-wrap:wrap;gap:1px;max-width:420px;vertical-align:middle}
.strip i{display:block;width:7px;height:13px;border-radius:1px}
.pill.res{background:var(--accent-bg);color:var(--accent);border-color:transparent}
input[type=number]{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
</style></head>

</div></div>

function decodeBuffer(buf){
  const u8 = new Uint8Array(buf);
  if (u8[0]===0xFF && u8[1]===0xFE) return new TextDecoder('utf-16le').decode(u8);
  if (u8[0]===0xFE && u8[1]===0xFF) return new TextDecoder('utf-16be').decode(u8);
  try { return new TextDecoder('utf-8',{fatal:true}).decode(u8).replace(/^﻿/,''); }
  catch(e){ return new TextDecoder('windows-1250').decode(u8); }
}

/* Lenient ;-separated CSV parser. PCS7 does not escape quotes inside quoted fields
   (e.g. ""Run" operating state"), so a quote only closes a field if it is followed by ; or EOL. */
function parseCSV(text){
  const rows=[]; let row=[]; let i=0; const n=text.length;
  const isEnd = c => c===undefined || c===';' || c==='\r' || c==='\n';
  while(i<n){
    if(text[i]==='"'){
      let j=i+1, start=j, s='';
      while(j<n){
        if(text[j]==='"'){
          const nx=text[j+1];
          if(isEnd(nx)){ s+=text.slice(start,j); break; }
          if(nx==='"' && isEnd(text[j+2])){ s+=text.slice(start,j)+'"'; j++; break; }
        }
        j++;
      }
      if(j>=n) s+=text.slice(start,n);
      row.push(s); i=j+1;
    } else {
      let j=i; while(j<n && text[j]!==';' && text[j]!=='\r' && text[j]!=='\n') j++;
      row.push(text.slice(i,j)); i=j;
    }
    if(text[i]===';'){ i++; if(i<n && text[i]!=='\r' && text[i]!=='\n') continue; }
    if(text[i]==='\r') i++;
    if(text[i]==='\n') i++;
    if(!(row.length===1 && row[0]==='')) rows.push(row);
    row=[];
  }
  if(row.length) rows.push(row);
  return rows;
}

function detectKind(text){
  if (typeof PCS7Parser!=='undefined' && PCS7Parser.detect(text.slice(0,200000), '')==='hw') return 'hw';
  const first = text.slice(0, 400).split(/\r?\n/)[0];
  if (/^\s*OB\d+\s*;/.test(first)) return 'rs';
  const h = first.toLowerCase();
  if (h.startsWith('source chart;')) return 'ic';
  if (h.startsWith('block type;') && h.includes('s7 name')) return 'bt';
  if (h.startsWith('sfc type;')) return 'ac';
  if (h.includes('symbol') && h.includes('address') && h.includes('chart element')) return 'cr';
  if (h.includes('sfc') && h.includes('chart element')) return 'sx';
  return null;
}

function headerIndex(hdr, names){
  const low = hdr.map(x=>x.trim().toLowerCase());
  const out={};
  for (const [k,n] of Object.entries(names)){
    const i = low.indexOf(n.toLowerCase());
    out[k] = i;
  }
  return out;
}

/* ---------------- Model ---------------- */
function newModel(){
  return {
    files:{},           // kind -> {fileName, rows}
    blocks:new Map(),   // id -> block
    charts:new Map(),   // path -> chart
    edges:[],
    addrs:new Map(),    // address -> {addr, refs:[]}
    sfcTypes:new Map(), // type -> {name, ios:Map(base->io), fromAccess:bool}
    sfcCharts:new Map(),// path -> {path, rows:[]}
    run:[],             // run sequence entries
    obs:new Map(),      // ob -> {ob, name, count}
    folderRoot:null,
  };
}

const SEP2 = '\\\\'; // the PCS7 "\\" between hierarchy folder and chart

function splitChartPath(p){
  const k = p.indexOf(SEP2);
  if (k<0) return {folder:'', chain:[p]};
  return {folder:p.slice(0,k), chain:p.slice(k+2).split('\\')};
}

function ensureChart(M, path, isSfc){
  let c = M.charts.get(path);
  if (!c){
    const {folder, chain} = splitChartPath(path);
    const parent = chain.length>1 ? folder + SEP2 + chain.slice(0,-1).join('\\') : null;
    c = {path, folder, name:chain[chain.length-1], parent, blocks:new Set(), isSfc:false, top:null};
    M.charts.set(path, c);
    if (parent){ ensureChart(M, parent); const b = ensureBlockById(M, path, parent, c.name); b.kind = 'chart'; if(!b.type) b.type='(CFC chart)'; M.charts.get(parent).blocks.add(path); }
    c.top = parent ? M.charts.get(parent).top : path;
  }
  if (isSfc) c.isSfc = true;
  return c;
}

function ensureBlockById(M, id, chart, name){
  let b = M.blocks.get(id);
  if (!b){
    b = {id, chart, name, type:'', fb:'', comment:'', kind:'block', pins:new Map(), inE:[], outE:[], run:[], inBT:false};
    M.blocks.set(id, b);
  }
  return b;
}

/* chart + element ("Blk.Pin.Sub" or ".PIN" for the chart itself) -> {block, pin} */
function ensureElement(M, chartPath, element, type){
  ensureChart(M, chartPath, type==='(SFC chart)');
  const dot = element.indexOf('.');
  const bname = dot<0 ? element : element.slice(0,dot);
  const pin = dot<0 ? '' : element.slice(dot+1);
  let b;
  if (bname===''){ // the chart itself (SFC chart / chart interface)
    const c = M.charts.get(chartPath);
    b = ensureBlockById(M, chartPath, c.parent, c.name);
    if (type==='(SFC chart)'){ b.kind='sfc'; c.isSfc=true; }
    else if (b.kind==='block') b.kind='chart';
    if (!b.type && type) b.type = type;
  } else {
    const id = chartPath + '\\' + bname;
    if (M.charts.has(id) || type==='(CFC chart)'){ ensureChart(M, id); }
    b = ensureBlockById(M, id, chartPath, bname);
    M.charts.get(chartPath).blocks.add(id);
    if (type && (!b.type || b.type==='(CFC chart)')) b.type = type;
    if (type==='(CFC chart)') b.kind='chart';
    if (type==='(SFC chart)') b.kind='sfc';
  }
  return {b, pin};
}

function ensurePin(b, name, dir, comment){
  let p = b.pins.get(name);
  if (!p){ p = {name, dir:dir||'', comment:'', edges:[], addrs:[], sfc:[]}; b.pins.set(name,p); }
  if (dir && !p.dir) p.dir = dir;
  if (comment && !p.comment) p.comment = comment;
  return p;
}

function loadBT(M, rows){
  const ix = headerIndex(rows[0], {type:'Block type', s7:'S7 name', chart:'Chart', block:'Block', comment:'Block comment'});
  for (let r=1;r<rows.length;r++){
    const x = rows[r]; const chart = x[ix.chart]; const name = x[ix.block];
    if (!chart || name===undefined) continue;
    const type = x[ix.type]||'';
    const {b} = ensureElement(M, chart, name, type);
    b.type = type || b.type; b.fb = x[ix.s7]||b.fb; if (x[ix.comment]) b.comment = x[ix.comment];
    b.inBT = true;
  }
}

function loadIC(M, rows){
  // duplicate header names -> fixed positions
  for (let r=1;r<rows.length;r++){
    const x = rows[r]; if (x.length<8) continue;
    const s = ensureElement(M, x[0], x[1], x[3]);
    const d = ensureElement(M, x[4], x[5], x[7]);
    const sp = ensurePin(s.b, s.pin, 'out', x[2]);
    const dp = ensurePin(d.b, d.pin, 'in', x[6]);
    const e = {a:s.b.id, ap:s.pin, b:d.b.id, bp:d.pin, dead:(x[8]||'').trim()!==''};
    M.edges.push(e); s.b.outE.push(e); d.b.inE.push(e); sp.edges.push(e); dp.edges.push(e);
  }
}

function loadCR(M, rows){
  const ix = headerIndex(rows[0], {sym:'Symbol', addr:'Address', dt:'Data type', rw:'R/W', chart:'Chart', el:'Chart element', com:'Element comment', type:'Type'});
  for (let r=1;r<rows.length;r++){
    const x = rows[r]; const addr = (x[ix.addr]||'').trim(); if (!addr || !x[ix.chart]) continue;
    const rw = (x[ix.rw]||'').trim();
    const {b,pin} = ensureElement(M, x[ix.chart], x[ix.el]||'', x[ix.type]);
    const sym = (x[ix.sym]||'').trim();
    const ref = {addr, sym: sym==='---'?'':sym, dt:x[ix.dt]||'', rw, block:b.id, pin, comment:x[ix.com]||''};
    const p = ensurePin(b, pin, rw.includes('W')&&!rw.includes('R') ? 'out' : 'in', ref.comment);
    p.addrs.push(ref);
    let a = M.addrs.get(addr); if (!a){ a={addr, refs:[], sym:'', dt:ref.dt}; M.addrs.set(addr,a); }
    if (ref.sym && !a.sym) a.sym = ref.sym;
    a.refs.push(ref);
  }
}

function sfcTypeEntry(M, name){
  let t = M.sfcTypes.get(name);
  if (!t){ t = {name, ios:new Map(), fromAccess:false}; M.sfcTypes.set(name,t); }
  return t;
}
function sfcIO(t, ioName){
  const base = ioName.split('.')[0];
  let io = t.ios.get(base);
  if (!io){ io = {name:ioName, base, section:'', assign:'', charact:'', rw:'', uses:[]}; t.ios.set(base, io); }
  return io;
}

function loadAC(M, rows){
  const ix = headerIndex(rows[0], {type:'SFC type', io:'I/O name', sec:'Section', as:'Assignment', ch:'Characteristic', rw:'R/W', seq:'Sequencer', ad:'Address', ty:'Type', val:'Value'});
  for (let r=1;r<rows.length;r++){
    const x = rows[r]; if (!x[ix.type]) continue;
    const t = sfcTypeEntry(M, x[ix.type]); t.fromAccess = true;
    const io = sfcIO(t, x[ix.io]||'');
    io.name = x[ix.io]; io.section = x[ix.sec]||io.section; io.assign = x[ix.as]||io.assign; io.charact = x[ix.ch]||io.charact;
    const rw = x[ix.rw]||''; if (!io.rw.includes(rw)) io.rw += rw;
    io.uses.push({seq:x[ix.seq]||'', addr:x[ix.ad]||'', kind:x[ix.ty]||'', rw, val:x[ix.val]||''});
  }
}

function loadSX(M, rows){
  const ix = headerIndex(rows[0], {chart:'Chart', el:'Chart element', bt:'Block type', rw:'R/W', sfc:'SFC', ad:'Address', ty:'Type'});
  for (let r=1;r<rows.length;r++){
    const x = rows[r]; if (!x[ix.chart]) continue;
    const sfcFull = x[ix.sfc]||''; const li = sfcFull.lastIndexOf('\\');
    const sfcId = li>0 ? sfcFull.slice(0,li) : sfcFull; const seq = li>0 ? sfcFull.slice(li+1) : '';
    const rw = x[ix.rw]||''; const btype = x[ix.bt]||'';
    const use = {seq, addr:x[ix.ad]||'', kind:x[ix.ty]||'', rw};
    if (!sfcId.includes(SEP2) && sfcId===btype){
      // SFC type instance accessing its own interface -> fallback for "Accesses in SFC types"
      const {b,pin} = ensureElement(M, x[ix.chart], x[ix.el]||'', btype);
      const t = sfcTypeEntry(M, btype);
      if (!t.fromAccess){
        const io = sfcIO(t, pin);
        if (!io.rw.includes(rw)) io.rw += rw;
        if (!io.section) io.section = rw==='W' ? 'OUT' : 'IN';
        io.uses.push(Object.assign({inst:b.id}, use));
      }
      continue;
    }
    const {b,pin} = ensureElement(M, x[ix.chart], x[ix.el]||'', btype);
    const p = ensurePin(b, pin, rw==='W' ? 'in' : '', '');
    const ref = Object.assign({sfc:sfcId, block:b.id, pin}, use);
    p.sfc.push(ref);
    if (sfcId.includes(SEP2)){
      ensureChart(M, sfcId, true);
      const sb = ensureBlockById(M, sfcId, M.charts.get(sfcId).parent, M.charts.get(sfcId).name); sb.kind='sfc'; if(!sb.type) sb.type='(SFC chart)';
      let sc = M.sfcCharts.get(sfcId); if (!sc){ sc={path:sfcId, rows:[]}; M.sfcCharts.set(sfcId, sc); }
      sc.rows.push(ref);
    } else {
      // another SFC type accessing a foreign block (rare)
      let sc = M.sfcCharts.get(sfcId); if (!sc){ sc={path:sfcId, rows:[], isType:true}; M.sfcCharts.set(sfcId, sc); }
      sc.rows.push(ref);
    }

function loadRS(M, text){
  const lines = text.split(/\r?\n/);
  const joined=[];
  for (const l of lines){
    if (/^\s*OB\d+\s*;/.test(l)) joined.push(l);
    else if (joined.length && l.trim()) joined[joined.length-1] += ' ' + l.trim();

  let idx=0;

    const m = l.match(/^\s*(OB\d+)\s*;(.*)$/); if (!m) continue;

    let o = M.obs.get(ob); if (!o){ o={ob, name:obName, count:0}; M.obs.set(ob,o); }
    let group='', ratio='', path='', type='', comment='';
    if (parts.length===2 && parts[1].includes(SEP2)) { path = parts[1].trim(); }
    else if (parts.length>=5){

      const tc = parts.slice(5).join(';').trim().replace(/^"/,'').replace(/"$/,'');
      const bar = tc.indexOf('|');
      type = (bar<0 ? tc : tc.slice(0,bar)).trim(); comment = bar<0 ? '' : tc.slice(bar+1).trim();
    } else continue;
    if (!path.includes(SEP2)) continue;
    const k = path.indexOf(SEP2); const li = path.lastIndexOf('\\');
    let b;
    if (li > k+1){
      const chart = path.slice(0,li), name = path.slice(li+1);
      b = ensureElement(M, chart, name, type).b;
      if (!b.type) b.type = type;
      if (comment && !b.comment) b.comment = comment;
    } else {
      ensureChart(M, path);
      const c = M.charts.get(path);
      b = ensureBlockById(M, path, c.parent, c.name);
      if (b.kind==='block') b.kind = 'sfc';
      c.isSfc = true; if (!b.type) b.type='(SFC chart)';
    }
    const e = {ob, obName, group, ratio, block:b.id, pos:++idx, n:++o.count};
    b.run.push(e); M.run.push(e);
  }
}

function buildFolders(M){
  const root = {name:'Projekt', path:'', folders:new Map(), charts:[], nCharts:0};
  for (const c of M.charts.values()){
    if (c.parent) continue;
    let f = root;
    if (c.folder){
      let acc='';
      for (const seg of c.folder.split('\\')){
        acc = acc ? acc+'\\'+seg : seg;
        let nf = f.folders.get(seg);
        if (!nf){ nf={name:seg, path:acc, folders:new Map(), charts:[], nCharts:0}; f.folders.set(seg,nf); }
        f = nf;
      }
    }
    f.charts.push(c.path);
  }
  const count = f => { let n=f.charts.length; for (const s of f.folders.values()) n+=count(s); f.nCharts=n; f.charts.sort(natCmpChart); return n; };
  count(root);
  M.folderRoot = root;
  M.folderIndex = new Map();
  const idx = f => { M.folderIndex.set(f.path, f); for (const s of f.folders.values()) idx(s); };
  idx(root);
}
function natCmp(a,b){ return a.localeCompare(b, undefined, {numeric:true, sensitivity:'base'}); }
function natCmpChart(a,b){ return natCmp(a,b); }

function buildModel(texts){
  const M = newModel();
  const order = ['bt','ic','cr','ac','sx','rs'];
  for (const k of order){
    const f = texts[k]; if (!f || k==='hw') continue;
    if (k==='rs'){ loadRS(M, f.text); M.files[k] = {fileName:f.fileName, rows:M.run.length}; continue; }
    const rows = parseCSV(f.text);
    ({bt:loadBT, ic:loadIC, cr:loadCR, ac:loadAC, sx:loadSX})[k](M, rows);
    M.files[k] = {fileName:f.fileName, rows:rows.length-1};
  }
  if (texts.hw && texts.hw.length && typeof PCS7Parser!=='undefined'){
    M.hw = {roots: texts.hw.map(f=>PCS7Parser.parseHw(f.text, f.fileName))};
    let mods=0; for (const r of M.hw.roots) hwWalk(r, n=>{ if (n.processData) mods++; });
    M.files.hw = {fileName: texts.hw.map(f=>f.fileName).join(', '), rows: mods, unit:'karet'};
    linkHW(M);
  }
  // SFC instance pin directions from SFC type I/O sections
  for (const b of M.blocks.values()){
    const t = M.sfcTypes.get(b.type);
    if (t){ b.kind = 'sfci';
      for (const io of t.ios.values()){ const p=b.pins.get(io.base); if (p && io.section) p.dir = io.section==='OUT' ? 'out' : 'in'; }
    }
  }
  buildFolders(M);
  return M;
}

'use strict';
/* ================= HW Config (.cfg) – channels, reserves, checks =================
   HW Config parsing + module catalogue: PCS7-IO-Analyzer (vendor/parser.js, vendor/catalog.js, MIT). */

const HWST = {
  used:     {t:'použito',            cls:'ok',   col:'var(--ok)'},
  conflict: {t:'vícenásobný zápis',  cls:'err',  col:'var(--err)'},
  reserve:  {t:'rezerva',            cls:'res',  col:'var(--accent)'},
  named:    {t:'pojmenováno, v CFC nepoužito', cls:'warn', col:'var(--warn)'},
  dev:      {t:'data zařízení (nepoužito)',     cls:'',     col:'var(--c-ext)'},
  unknown:  {t:'neznámý počet kanálů', cls:'',  col:'var(--c-ext)'},
};
const IOTYPES = ['DI','DO','AI','AO','DEV'];

function normAddr(a){ return String(a||'').toUpperCase().replace(/\s+/g,'').replace(/^P(?=[IQ])/,''); }
function parseIOAddr(a){ const m = normAddr(a).match(/^([IQ])([BWD]?)(\d+)(?:\.(\d))?$/); if (!m) return null; return {dir:m[1], w:m[2]||'X', byte:+m[3], bit:m[4]!=null?+m[4]:null}; }
const RESERVE_RE = /\b(rezerv\w*|reserve|spare|voln[ýéá]|volny|nevyu[zž]ito)\b/i;

function hwWalk(n, fn, ctx={}){
  const c = Object.assign({}, ctx);
  if (n.kind==='project') c.project=n; if (n.kind==='station') c.station=n; if (n.kind==='controller') c.controller=n; if (n.kind==='device') c.device=n;
  fn(n, c);
  (n.children||[]).forEach(x=>hwWalk(x, fn, c));
}

function linkHW(M){
  const roots = M.hw.roots;
  const amap = new Map();
  for (const a of M.addrs.values()){ const k=normAddr(a.addr); let l=amap.get(k); if(!l){ l=[]; amap.set(k,l);} l.push(...a.refs); }
  const get = k => amap.get(k) || [];
  M.hw.ch = []; M.hw.byAddr = new Map(); M.hw.index = new Map(); M.hw.ranges = [];
  for (const r of roots) hwWalk(r, (n, ctx)=>{
    M.hw.index.set(n.id, {n, ctx});
    for (const a of n.inAddrs||[]) if (a[2]) M.hw.ranges.push({dir:'I', s:a[0], e:a[0]+a[2]-1, n});
    for (const a of n.outAddrs||[]) if (a[2]) M.hw.ranges.push({dir:'Q', s:a[0], e:a[0]+a[2]-1, n});
    for (const c of n.channels||[]){
      let refs = get(c.address), via = '';
      const p = parseIOAddr(c.address);
      if (!refs.length && p){
        // indirect: byte / word / dword access covering this channel
        const cand = [];
        if (p.w==='X'){ cand.push(`${p.dir}B${p.byte}`, `${p.dir}W${p.byte}`, `${p.dir}W${p.byte-1}`, `${p.dir}D${p.byte}`, `${p.dir}D${p.byte-1}`, `${p.dir}D${p.byte-2}`, `${p.dir}D${p.byte-3}`); }
        else if (p.w==='W'){ cand.push(`${p.dir}B${p.byte}`, `${p.dir}B${p.byte+1}`, `${p.dir}D${p.byte}`, `${p.dir}D${p.byte-2}`); }
        for (const k of cand){ const r=get(k); if (r.length){ refs = refs.concat(r); via = via || k; } }
      }
      const writers = new Set(refs.filter(r=>r.rw.includes('W')).map(r=>r.block+'.'+r.pin));
      let st;
      if (c.confidence==='unknown') st='unknown';
      else if (writers.size>1 && !via) st='conflict';
      else if (refs.length) st='used';
      else if (c.ioType==='DEV' || n.ioType==='DEV') st='dev';
      else if (!c.hwSymbol || RESERVE_RE.test(c.hwSymbol+' '+c.hwComment)) st='reserve';
      else st='named';
      const e = {c, n, ctx, refs, via, st, type: c.ioType || n.ioType};
      M.hw.ch.push(e); M.hw.byAddr.set(normAddr(c.address), e);
    }
  });
  // CFC I/Q references without a HW channel
  M.hw.orphans = [];
  for (const a of M.addrs.values()){
    const p = parseIOAddr(a.addr); if (!p) continue;
    const k = normAddr(a.addr);
    if (M.hw.byAddr.has(k)) continue;
    const rng = M.hw.ranges.find(r=>r.dir===p.dir && p.byte>=r.s && p.byte<=r.e);
    if (rng && (rng.n.channels||[]).length && p.w!=='X') continue;            // byte/word access to an existing card
    M.hw.orphans.push({a, p, rng: rng ? rng.n : null});
  }
}

function hwStats(list){
  const s = {all:list.length, used:0, conflict:0, reserve:0, named:0, dev:0, unknown:0, byType:{}};
  for (const t of IOTYPES) s.byType[t] = {all:0, used:0, reserve:0, named:0, other:0};
  for (const e of list){ s[e.st]++; const b=s.byType[e.type]||s.byType.DEV; b.all++; if (e.st==='used'||e.st==='conflict') b.used++; else if (e.st==='reserve') b.reserve++; else if (e.st==='named') b.named++; else b.other++; }
  return s;
}
function chUnder(node){ const out=[]; const ids=new Set(); hwWalk(node, n=>ids.add(n)); for (const e of M.hw.ch) if (ids.has(e.n)) out.push(e); return out; }
function hwNodeTitle(n){ const a = n.address!=null ? ` · ${n.bus==='PROFINET'?'PN':'DP'} ${n.address}` : ''; return (n.slot!=null && n.kind!=='device' ? `Slot ${n.slot}${n.subslot!=null?'.'+n.subslot:''} – ` : '') + n.name + (n.kind==='device'?a:''); }
function hwLoc(e, short){ const d=e.ctx.device; const parts=[]; if (!short && e.ctx.station) parts.push(e.ctx.station.name); if (d) parts.push(d.name); parts.push('slot '+(e.n.slot??'?')); return parts.join(' › '); }
function hwLink(id, text){ return `<a class="lnk" data-go="hw" data-id="${esc(id)}">${esc(text)}</a>`; }
function hwRefList(e){
  if (!e.refs.length) return '';
  return (e.via?`<span class="muted">přes ${esc(e.via)}:</span> `:'') + e.refs.slice(0,4).map(r=>{ const b=M.blocks.get(r.block); return `<span class="muted">${esc(b&&b.chart?chartShort(b.chart)+'\\':'')}</span>${bl(r.block)}<span class="mono">.${esc(r.pin)}</span> <span class="pill">${esc(r.rw)}</span>`; }).join('<br>') + (e.refs.length>4?`<br><span class="muted">… +${e.refs.length-4}</span>`:'');
}
function hwStatusPill(st){ const s=HWST[st]; return `<span class="pill ${s.cls}">${s.t}</span>`; }
function channelStrip(list){
  return `<span class="strip">${list.map(e=>`<i style="background:${HWST[e.st].col}" title="${esc(e.c.address+' '+(e.c.hwSymbol||'')+' – '+HWST[e.st].t)}"></i>`).join('')}</span>`;
}

function sideHW(f){
  if (!M.hw) return needFiles(['hw'],'strom HW');

    if (n.kind==='module' || n.kind==='submodule'){
      if (!n.processData) return '';

  };
  h += `<div class="tn" data-tn="hw" data-id=""><span class="tw"></span>${GI.folder}<b>Přehled HW a rezerv</b></div>`;

function hwFilterState(){ return Object.assign({types:['DI','DO','AI','AO'], scope:'', named:false, q:'', need:{DI:0,DO:0,AI:0,AO:0}}, NAV.opt||{}); }
function hwReserveFinder(body){
  const st = hwFilterState();
  const devs=[]; for (const r of M.hw.roots) hwWalk(r, n=>{ if (n.kind==='device'||n.kind==='station') devs.push(n); });

    <div class="row" style="margin-top:10px"><b>Potřebuji:</b>${['DI','DO','AI','AO'].map(t=>`<label>${t} <input type="number" min="0" data-need="${t}" value="${st.need[t]||0}" style="width:60px"></label>`).join('')}
      <button class="primary" id="rfNeed">Navrhnout kanály</button><span class="muted">vybírá z karet s nejvíc rezervami, aby byly nové signály pohromadě</span></div></div>
    <div id="rfOut"></div>`;
  const scopeSet = st.scope ? new Set(chUnder(M.hw.index.get(st.scope).n)) : null;
  const q = st.q.trim().toLowerCase();
  let list = M.hw.ch.filter(e=> (e.st==='reserve' || (st.named && e.st==='named')) && st.types.includes(e.type) && (!scopeSet || scopeSet.has(e)));
  if (q) list = list.filter(e=>matchTokens((e.c.address+' '+e.c.hwSymbol+' '+e.c.hwComment+' '+e.n.name+' '+e.n.mlfb+' '+hwLoc(e)).toLowerCase(), q));
  // proposal
  const want = st.need; let pick = null;
  if (NAV.propose){
    pick = new Set();
    for (const t of ['DI','DO','AI','AO']){

      const by = new Map(); for (const e of list.filter(e=>e.type===t)){ (by.get(e.n)||by.set(e.n,[]).get(e.n)).push(e); }
      const groups=[...by.values()].sort((a,b)=>b.length-a.length);
      // prefer a single card that fits all, otherwise largest first
      const fit = groups.filter(g=>g.length>=rem).sort((a,b)=>a.length-b.length)[0];
      for (const g of (fit?[fit]:groups)){ if (rem<=0) break; for (const e of g.slice(0,rem)) pick.add(e); rem -= Math.min(rem,g.length); }
      if (rem>0) toast(`Nedostatek rezerv ${t}: chybí ${rem}`);
    }
    list = list.filter(e=>pick.has(e));
  }

  $('#rfOut').innerHTML = `<div class="muted" style="margin-bottom:6px">${list.length} kanálů na ${byMod.size} kartách${pick?' – <b>návrh</b> <a class="lnk" id="rfClr">zrušit návrh</a>':''}</div>
    <div class="tablewrap"><table class="t"><tr><th>Stanice › slot</th><th>Karta</th><th>Typ</th><th>Adresa</th><th>HW symbol</th><th>Komentář</th><th>Stav</th></tr>
    ${[...byMod.entries()].map(([n,es])=>es.map((e,i)=>`<tr>${i===0?`<td rowspan="${es.length}" class="nw">${esc(hwLoc(e,true))}</td><td rowspan="${es.length}">${hwLink(n.id, n.name)}<div class="muted mono" style="font-size:11px">${esc(n.mlfb)}</div><div class="muted" style="font-size:11px">${es.length} vol. z ${M.hw.ch.filter(x=>x.n===n).length}</div></td>`:''}
      <td>${esc(e.type)}</td><td class="mono nw">${esc(e.c.address)}</td><td>${esc(e.c.hwSymbol)}</td><td class="muted">${esc(e.c.hwComment)}</td><td>${hwStatusPill(e.st)}</td></tr>`).join('')).join('')}</table></div>`;
  const upd = patch => go({view:'hw', mode:'res', opt:Object.assign({}, st, patch)}, false);
  $('#rfTypes').onclick=e=>{ const t=e.target.dataset.t; if(!t) return; const ts=st.types.includes(t)?st.types.filter(x=>x!==t):st.types.concat(t); upd({types:ts}); };
  $('#rfScope').onchange=e=>upd({scope:e.target.value});
  $('#rfNamed').onchange=e=>upd({named:e.target.checked});

'use strict';
/* ================= Graph layout + SVG renderer with pan/zoom ================= */
const G = {HEAD:34, PIN:15, GAPX:110, GAPY:18};

function textW(s, px){ return (s||'').length * px; }

function measureNode(n){
  const ins=n.ins||[], outs=n.outs||[];
  const rows = Math.max(ins.length, outs.length);
  n.h = n.small ? 26 + rows*G.PIN : G.HEAD + Math.max(rows,0)*G.PIN + (rows?6:4);
  const mi = Math.max(0,...ins.map(p=>textW(p,6.4)));
  const mo = Math.max(0,...outs.map(p=>textW(p,6.4)));
  n.w = Math.min(360, Math.max(110, textW(n.title,7.4)+22, textW(n.sub,5.9)+18, mi+mo+(mi&&mo?34:20)));
}

function layoutGraph(nodes, edges, opt={}){
  const byId = new Map(nodes.map(n=>[n.id,n]));
  nodes.forEach(measureNode);
  const succ=new Map(), pred=new Map();
  nodes.forEach(n=>{succ.set(n.id,new Set()); pred.set(n.id,new Set());});
  for (const e of edges){ if (e.from===e.to || !byId.has(e.from) || !byId.has(e.to)) continue; succ.get(e.from).add(e.to); pred.get(e.to).add(e.from); }
  // isolated nodes handled separately
  const conn = nodes.filter(n=>succ.get(n.id).size||pred.get(n.id).size);
  const iso = nodes.filter(n=>!(succ.get(n.id).size||pred.get(n.id).size));
  // break cycles (iterative DFS), ordered by preferred order
  const order = opt.order || new Map();
  const ord = n => order.has(n.id) ? order.get(n.id) : 1e9;
  const sorted = conn.slice().sort((a,b)=>ord(a)-ord(b) || natCmp(a.title,b.title));
  const state=new Map(); const back=new Set();
  for (const s of sorted){
    if (state.get(s.id)) continue;
    const stack=[[s.id, [...succ.get(s.id)]]]; state.set(s.id,1);
    while(stack.length){
      const top=stack[stack.length-1];
      if (!top[1].length){ state.set(top[0],2); stack.pop(); continue; }
      const nx = top[1].shift();
      const st = state.get(nx);
      if (st===1){ back.add(top[0]+'\u0000'+nx); continue; }
      if (!st){ state.set(nx,1); stack.push([nx,[...succ.get(nx)]]); }
    }
  }
  const S=new Map(), P=new Map();
  conn.forEach(n=>{S.set(n.id,[]);P.set(n.id,[]);});
  for (const [a,set] of succ) for (const b of set){ if (back.has(a+'\u0000'+b)) continue; if(S.has(a)){S.get(a).push(b);P.get(b).push(a);} }
  // longest path ranks (Kahn)
  const indeg=new Map(conn.map(n=>[n.id,P.get(n.id).length]));
  const q=conn.filter(n=>!indeg.get(n.id)).map(n=>n.id); const topo=[];
  const rank=new Map(conn.map(n=>[n.id,0]));
  while(q.length){ const a=q.shift(); topo.push(a); for (const b of S.get(a)){ rank.set(b, Math.max(rank.get(b), rank.get(a)+1)); indeg.set(b, indeg.get(b)-1); if(!indeg.get(b)) q.push(b);} }
  // pull sources right (next to their first successor)
  for (let i=topo.length-1;i>=0;i--){ const a=topo[i]; const s=S.get(a); if (!P.get(a).length && s.length){ rank.set(a, Math.min(...s.map(b=>rank.get(b)))-1); } }
  // fixed side placement
  let minR=Infinity,maxR=-Infinity; for (const r of rank.values()){minR=Math.min(minR,r);maxR=Math.max(maxR,r);}
  for (const n of conn){ if (n.side==='L') rank.set(n.id, Math.min(rank.get(n.id), minR)); if (n.side==='R') rank.set(n.id, Math.max(rank.get(n.id), maxR)); }
  for (const n of conn){ if (n.side==='L'){ const s=S.get(n.id); if(s.length) rank.set(n.id, Math.min(...s.map(b=>rank.get(b)))-1);} }
  minR=Infinity; for (const r of rank.values()) minR=Math.min(minR,r);
  const layers=[];
  for (const n of conn){ const r=rank.get(n.id)-minR; n.rank=r; (layers[r]=layers[r]||[]).push(n); }
  for (let i=0;i<layers.length;i++) layers[i]=layers[i]||[];
  layers.forEach(L=>L.sort((a,b)=>ord(a)-ord(b) || natCmp(a.title,b.title)));
  /* ---- dummy nodes: long edges get a lane in every intermediate column (edges from one pin share it) ---- */
  const dmap=new Map(); const segs=[];  // segment: {u,up,v,vp}
  const addSeg=(u,up,v,vp)=>{ const sg={u,up,v,vp}; segs.push(sg); (u._dn||(u._dn=[])).push(sg); (v._up||(v._up=[])).push(sg); };
  conn.forEach(n=>{ n._dn=[]; n._up=[]; });
  for (const e of edges){
    e._chain=null; e._back=false;
    const A=byId.get(e.from), B=byId.get(e.to); if(!A||!B||A.rank==null||B.rank==null) continue;
    if (B.rank<=A.rank){
      // feedback: lanes from A's column back to B's column, traversed right-to-left
      e._back=true; const chain=[]; let prev=null;
      for (let r=A.rank; r>=B.rank; r--){
        const key='b\u0000'+e.from+'\u0000'+(e.fp??'')+'\u0000'+e.to+'\u0000'+r;
        let d=dmap.get(key);
        if (!d){ d={id:'\u00a7'+key, dummy:true, back:true, w:0, h:4, rank:r, _dn:[], _up:[], _anc:[], _o:ord(A)}; dmap.set(key,d); layers[r].push(d);
          if (r===A.rank) d._anc.push({n:A, p:e.fp, out:true});
          if (r===B.rank) d._anc.push({n:B, p:e.tp, out:false});
          if (prev) addSeg(d, null, prev, null); }
        chain.push(d); prev=d;
      }
      e._chain=chain; continue;
    }
    let prev=A, prevPin=e.fp; const chain=[];
    for (let r=A.rank+1; r<B.rank; r++){
      const key=e.from+'\u0000'+(e.fp??'')+'\u0000'+r;
      let d=dmap.get(key);
      if (!d){ d={id:'§'+key, dummy:true, w:0, h:4, rank:r, _dn:[], _up:[], _o:ord(A)}; dmap.set(key,d); layers[r].push(d); addSeg(prev, prevPin, d, null); }
      chain.push(d); prev=d; prevPin=null;
    }
    e._chain=chain;
    if (!prev._dn.some(sg=>sg.v===B && sg.vp===e.tp && sg.up===prevPin)) addSeg(prev, prevPin, B, e.tp);
  }
  const ordX = n => n.dummy ? n._o : ord(n);
  layers.forEach(L=>L.sort((a,b)=>ordX(a)-ordX(b)));
  // crossing reduction: barycenter sweeps on adjacent layers
  const pos=new Map(); const setPos=L=>L.forEach((n,i)=>pos.set(n,i));
  layers.forEach(setPos);
  for (let it=0; it<12; it++){
    const down = it%2===0;
    const seq = down ? layers.slice(1) : layers.slice(0,-1).reverse();
    for (const L of seq){
      for (const n of L){ const nb = down ? n._up.map(sg=>sg.u) : n._dn.map(sg=>sg.v); n._bc = nb.length ? nb.reduce((s,x)=>s+pos.get(x),0)/nb.length : pos.get(n); }
      for (const n of L) if (n._anc && n._anc.length){ const a=n._anc[0]; n._bc = a.n._bc + (a.out ? 0.3 : -0.3); }
      L.sort((a,b)=>a._bc-b._bc || pos.get(a)-pos.get(b)); setPos(L);
    }
  }
  // x
  let x=0; const colX=[], colW=[];
  for (const L of layers){ colX.push(x); const w=Math.max(40,...L.filter(n=>!n.dummy).map(n=>n.w)); colW.push(w); L.forEach(n=>n.colW=w); x += w + G.GAPX; }
  layers.forEach((L,i)=>L.forEach(n=>{ if (n.dummy){ n.x=colX[i]; n.w=colW[i]; } else n.x = colX[i] + (n.side==='L' ? n.colW-n.w : 0); n.cx0=colX[i]; n.cx1=colX[i]+colW[i]; }));
  // y
  const gap=(a,b)=> (a.dummy||b.dummy) ? 8 : G.GAPY;
  layers.forEach(L=>{ let y=0; L.forEach((n,i)=>{ n.y=y; y+=n.h+(i<L.length-1?gap(n,L[i+1]):0); }); });
  const pinY = (n, pin, isOut) => { if (n.dummy) return n.y+n.h/2; const list = isOut ? n.outs : n.ins; const i = pin==null ? -1 : (list||[]).indexOf(pin); return i<0 ? n.y + n.h/2 : n.y + (n.small?26:G.HEAD) + i*G.PIN + G.PIN/2; };
  const relax = (L, want) => {
    // isotonic regression (PAV): keep order, no overlap, minimise distance to desired y
    let off=0; const items=L.map((n,i)=>{ const d=want(n); const it={n, off, z:(d==null?n.y:d)-off, w:d==null?0.05:(n.dummy?0.6:1)}; off+=n.h+(i<L.length-1?gap(n,L[i+1]):0); return it; });
    const blocks=[];
    for (const it of items){
      blocks.push({sum:it.z*it.w, w:it.w, cnt:1});
      while(blocks.length>1){ const B=blocks[blocks.length-1], A=blocks[blocks.length-2]; if (A.sum/A.w <= B.sum/B.w) break; A.sum+=B.sum; A.w+=B.w; A.cnt+=B.cnt; blocks.pop(); }
    }
    let k=0; for (const B of blocks){ const z=B.sum/B.w; for (let j=0;j<B.cnt;j++,k++){ items[k].n.y = z + items[k].off; } }
  };
  const anc = n => n._anc.reduce((s,a)=>s+pinY(a.n,a.p,a.out),0)/n._anc.length - n.h/2;
  const wantUp = n => { if (n._anc && n._anc.length) return anc(n); if (!n._up.length) return null; return n._up.reduce((s,sg)=>s+pinY(sg.u,sg.up,true)-(pinY(n,sg.vp,false)-n.y),0)/n._up.length; };
  const wantDn = n => { if (n._anc && n._anc.length) return anc(n); if (!n._dn.length) return null; return n._dn.reduce((s,sg)=>s+pinY(sg.v,sg.vp,false)-(pinY(n,sg.up,true)-n.y),0)/n._dn.length; };
  const wantBoth = n => { const a=wantUp(n), b=wantDn(n); return a==null ? b : b==null ? a : (a+b)/2; };
  for (let it=0; it<6; it++){
    for (let i=1;i<layers.length;i++) relax(layers[i], it<4 ? wantUp : wantBoth);
    for (let i=layers.length-2;i>=0;i--) relax(layers[i], it<4 ? wantDn : wantBoth);
  }
  const allItems = conn.concat([...dmap.values()]);
  // edge geometry
  for (const e of edges){
    const A=byId.get(e.from), B=byId.get(e.to); if (!A||!B||!e._chain||(!e._chain.length&&!e._back)) { e._pts=null; continue; }
    e._pts = e._chain.map(d=>[d.x, d.x+d.w, d.y+d.h/2]);
  }
  let minY=Infinity; allItems.forEach(n=>minY=Math.min(minY,n.y)); if(!isFinite(minY)) minY=0;
  allItems.forEach(n=>n.y-=minY);
  for (const e of edges) if (e._pts) e._pts.forEach(p=>p[2]-=minY);
  let maxY=0, maxX=0; conn.forEach(n=>{maxY=Math.max(maxY,n.y+n.h); maxX=Math.max(maxX,n.x+n.w);});
  // isolated nodes: grid below
  if (iso.length){
    iso.sort((a,b)=>ord(a)-ord(b)||natCmp(a.title,b.title));
    const W = Math.max(maxX, 1100); let cx=0, cy=maxY+(conn.length?60:0), rowH=0;
    for (const n of iso){ if (cx>0 && cx+n.w>W){ cx=0; cy+=rowH+G.GAPY; rowH=0; } n.x=cx; n.y=cy; cx+=n.w+30; rowH=Math.max(rowH,n.h); }
    if (conn.length) opt.isoTop = maxY+30;
  }
  return {nodes, edges, byId, pinY, isoTop:opt.isoTop};
}

const SVGNS='http://www.w3.org/2000/svg';
const CATCOL = {tech:'var(--c-tech)', drv:'var(--c-drv)', logic:'var(--c-logic)', sfc:'var(--c-sfc)', sfci:'var(--c-sfc)', chart:'var(--c-chart)', addr:'var(--c-addr)', ext:'var(--c-ext)'};

function renderGraph(host, L, opt={}){
  host.innerHTML='';
  host.classList.add('gwrap');
  const svg=document.createElementNS(SVGNS,'svg');
  const g=document.createElementNS(SVGNS,'g');
  svg.appendChild(g); host.appendChild(svg);
  const parts=[];
  if (L.isoTop!=null) parts.push(`<text x="0" y="${L.isoTop-8}" class="etext">Bez propojení v tomto pohledu:</text>`);
  // edges
  L.edges.forEach((e,i)=>{
    const a=L.byId.get(e.from), b=L.byId.get(e.to); if(!a||!b) return;
    const x1=a.x+a.w, y1=L.pinY(a,e.fp,true), x2=b.x, y2=L.pinY(b,e.tp,false);
    let d;
    const cv=(xa,ya,xb,yb)=>{ const dx=Math.max(20,(xb-xa)/2); return ` C${xa+dx},${ya} ${xb-dx},${yb} ${xb},${yb}`; };
    // leave/enter the column horizontally so curves only bend inside the gaps between columns
    const xs = (a.cx1!=null && a.cx1>x1) ? a.cx1 : x1, xe = (b.cx0!=null && b.cx0<x2) ? b.cx0 : x2;
    const head = `M${x1},${y1}` + (xs>x1 ? ` L${xs},${y1}` : ''), tail = xe<x2 ? ` L${x2},${y2}` : '';
    if (e._pts && e._back){
      d=`M${x1},${y1}`; let cx=x1, cy=y1, first=true;
      for (const [xl,xr,yy] of e._pts){
        if (first){ const tx=Math.max(x1,xr)+Math.min(50,G.GAPX/2-5); d+=` C${tx},${y1} ${tx},${yy} ${xr},${yy}`; first=false; }
        else { const dx=Math.max(20,(cx-xr)/2); d+=` C${cx-dx},${cy} ${xr+dx},${yy} ${xr},${yy}`; }
        d+=` L${xl},${yy}`; cx=xl; cy=yy;
      }
      const tx=Math.min(cx,xe)-Math.min(50,G.GAPX/2-5); d+=` C${tx},${cy} ${tx},${y2} ${xe},${y2}`+tail;
    }
    else if (e._pts){ d=head; let cx=xs, cy=y1; for (const [xa,xb,yy] of e._pts){ d+=cv(cx,cy,xa,yy)+` L${xb},${yy}`; cx=xb; cy=yy; } d+=cv(cx,cy,xe,y2)+tail; }
    else if (a===b){ const t=a.y-9, r=x1+22, l=x2-22; d=`M${x1},${y1} C${r},${y1} ${r},${t} ${x1-10},${t} L${x2+10},${t} C${l},${t} ${l},${y2} ${x2},${y2}`; }
    else if (xe > xs+10){ d=head+cv(xs,y1,xe,y2)+tail; }
    else { const off=60+Math.min(200,Math.abs(y2-y1)/4); d=`M${x1},${y1} C${x1+off},${y1} ${x2-off},${y2} ${x2},${y2}`; }
    parts.push(`<path class="edge ${e.cls||''}${e.dead?' dead':''}" d="${d}" data-i="${i}"><title>${esc(e.tip||'')}</title></path>`);
    if (e.label) parts.push(`<text class="etext" x="${(x1+x2)/2}" y="${(y1+y2)/2-3}" text-anchor="middle">${esc(e.label)}</text>`);
  });
  // nodes
  L.nodes.forEach((n,i)=>{
    const col = n.color || CATCOL[n.cat] || CATCOL.tech;
    const cls = ['node', n.cls||'', n.focus?'focus':''].join(' ');
    let s = `<g class="${cls}" data-n="${i}" transform="translate(${n.x},${n.y})"><title>${esc(n.tip||n.title)}</title>`;
    s += `<rect class="b" width="${n.w}" height="${n.h}" rx="5"/>`;
    s += `<rect class="h" width="${n.w}" height="${n.small?22:30}" rx="5" fill="${col}" opacity=".16"/><rect class="h" width="4" height="${n.h}" rx="2" fill="${col}"/>`;
    s += `<text class="t" x="10" y="15">${esc(clip(n.title, Math.floor((n.w-16)/7.2)))}</text>`;
    if (!n.small || n.sub) s += `<text class="s" x="10" y="${n.small?20:27}">${esc(clip(n.sub||'', Math.floor((n.w-14)/5.9)))}</text>`;
    const top = n.small ? 26 : G.HEAD;
    (n.ins||[]).forEach((p,k)=>{ const y=top+k*G.PIN+G.PIN/2; s+=`<line class="pl" x1="-6" y1="${y}" x2="0" y2="${y}"/><text class="p" x="7" y="${y+3.5}">${esc(p)}</text>`; });
    (n.outs||[]).forEach((p,k)=>{ const y=top+k*G.PIN+G.PIN/2; s+=`<line class="pl" x1="${n.w}" y1="${y}" x2="${n.w+6}" y2="${y}"/><text class="p" x="${n.w-7}" y="${y+3.5}" text-anchor="end">${esc(p)}</text>`; });
    s += '</g>';
    parts.push(s);
  });
  g.innerHTML = parts.join('');
  // index
  const edgeEls=[...g.querySelectorAll('path.edge')];
  const nodeEls=[...g.querySelectorAll('g.node')];
  const nodeIdx=new Map(L.nodes.map((n,i)=>[n.id,i]));
  const adj=L.nodes.map(()=>[]);
  edgeEls.forEach(el=>{ const e=L.edges[+el.dataset.i]; const a=nodeIdx.get(e.from), b=nodeIdx.get(e.to); if(a!=null) adj[a].push([el,b]); if(b!=null) adj[b].push([el,a]); });
  let pinned=null;
  const hilite=(i)=>{
    g.querySelectorAll('.hi,.dim').forEach(x=>x.classList.remove('hi','dim'));
    if (i==null) return;
    edgeEls.forEach(e=>e.classList.add('dim'));
    nodeEls.forEach(e=>e.classList.add('dim'));
    nodeEls[i].classList.remove('dim');
    for (const [el,o] of adj[i]){ el.classList.remove('dim'); el.classList.add('hi'); if(o!=null){ nodeEls[o].classList.remove('dim'); nodeEls[o].classList.add('hi'); } }
  };
  nodeEls.forEach((el,i)=>{
    el.addEventListener('mouseenter',()=>{ if(pinned==null) hilite(i); });
    el.addEventListener('mouseleave',()=>{ if(pinned==null) hilite(null); });
    el.addEventListener('click',ev=>{ ev.stopPropagation(); if (moved) return; pinned = pinned===i ? null : i; hilite(pinned); if (opt.onClick) opt.onClick(L.nodes[i], ev); });
    el.addEventListener('dblclick',ev=>{ ev.stopPropagation(); if (opt.onDbl) opt.onDbl(L.nodes[i], ev); });
  });
  // pan/zoom
  let tx=0, ty=0, sc=1, moved=false;
  const apply=()=>g.setAttribute('transform',`translate(${tx},${ty}) scale(${sc})`);
  const bbox=()=>{ let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity; L.nodes.forEach(n=>{x0=Math.min(x0,n.x-10);y0=Math.min(y0,n.y-10);x1=Math.max(x1,n.x+n.w+10);y1=Math.max(y1,n.y+n.h+10);}); if(L.isoTop!=null) y0=Math.min(y0,L.isoTop-25); return {x0,y0,x1,y1}; };
  const fit=(maxScale=1)=>{ const r=host.getBoundingClientRect(); const b=bbox(); if(!isFinite(b.x0)) return; sc=Math.min(maxScale,(r.width-40)/(b.x1-b.x0),(r.height-40)/(b.y1-b.y0)); sc=Math.max(sc,0.05); tx=(r.width-(b.x1-b.x0)*sc)/2-b.x0*sc; ty=Math.max(20,(r.height-(b.y1-b.y0)*sc)/2)-b.y0*sc; apply(); };
  const focusNode=(id)=>{ const i=nodeIdx.get(id); if(i==null) return; const n=L.nodes[i]; const r=host.getBoundingClientRect(); sc=Math.max(sc,0.6); const fitsH=n.h*sc < r.height-40; tx=r.width/2-(n.x+n.w/2)*sc; ty= fitsH ? r.height/2-(n.y+n.h/2)*sc : 20-n.y*sc; apply(); };
  svg.addEventListener('wheel',ev=>{ ev.preventDefault(); const r=svg.getBoundingClientRect(); const mx=ev.clientX-r.left, my=ev.clientY-r.top; const f=Math.exp(-ev.deltaY*0.0015); const ns=Math.min(4,Math.max(0.03,sc*f)); tx=mx-(mx-tx)*ns/sc; ty=my-(my-ty)*ns/sc; sc=ns; apply(); },{passive:false});
  let drag=null;
  svg.addEventListener('mousedown',ev=>{ if(ev.button!==0) return; drag={x:ev.clientX,y:ev.clientY,tx,ty}; moved=false; svg.classList.add('drag'); });
  window.addEventListener('mousemove',ev=>{ if(!drag) return; const dx=ev.clientX-drag.x, dy=ev.clientY-drag.y; if(Math.abs(dx)+Math.abs(dy)>3) moved=true; tx=drag.tx+dx; ty=drag.ty+dy; apply(); });
  window.addEventListener('mouseup',()=>{ if(drag){ drag=null; svg.classList.remove('drag'); setTimeout(()=>moved=false,0);} });
  svg.addEventListener('click',()=>{ if(!moved){ pinned=null; hilite(null);} });
  const ctl=document.createElement('div'); ctl.className='gctl';
  ctl.innerHTML='<button title="Přiblížit">+</button><button title="Oddálit">−</button><button title="Celý graf">⤢</button><button title="Uložit jako SVG">⇩</button>';
  const [bi,bo,bf,bs]=ctl.children;
  const zoomBy=f=>{ const r=host.getBoundingClientRect(); const mx=r.width/2,my=r.height/2; const ns=Math.min(4,Math.max(0.03,sc*f)); tx=mx-(mx-tx)*ns/sc; ty=my-(my-ty)*ns/sc; sc=ns; apply(); };
  bi.onclick=()=>zoomBy(1.25); bo.onclick=()=>zoomBy(0.8); bf.onclick=()=>fit(1.5);
  bs.onclick=()=>exportSVG(L, opt.fileName||'graf');
  host.appendChild(ctl);
  if (opt.hint){ const h=document.createElement('div'); h.className='ghint'; h.textContent=opt.hint; host.appendChild(h); }
  const initView=()=>{ fit(1); if (sc<0.5){ if (opt.focus && nodeIdx.has(opt.focus)) { sc=0.75; focusNode(opt.focus); } else { let hub=-1, best=-1; adj.forEach((l,i)=>{ if(l.length>best){best=l.length;hub=i;} }); sc=0.6; if (hub>=0) focusNode(L.nodes[hub].id); else { const b=bbox(); tx=20-b.x0*sc; ty=20-b.y0*sc; apply(); } } } };
  requestAnimationFrame(initView);
  return {fit, focusNode, hilite: id=>{ const i=nodeIdx.get(id); pinned=i; hilite(i); }};
}

function exportSVG(L, name){
  const host=document.querySelector('.gwrap svg g'); if(!host) return;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity; L.nodes.forEach(n=>{x0=Math.min(x0,n.x-10);y0=Math.min(y0,n.y-10);x1=Math.max(x1,n.x+n.w+10);y1=Math.max(y1,n.y+n.h+10);});
  const cs=getComputedStyle(document.documentElement);
  const vars=['--edge','--edge-hi','--line','--node','--text','--muted','--panel2','--c-tech','--c-drv','--c-logic','--c-sfc','--c-chart','--c-addr','--c-ext','--accent'];
  let css=':root{'+vars.map(v=>v+':'+cs.getPropertyValue(v)).join(';')+'}';
  css+=`.edge{fill:none;stroke:var(--edge);stroke-width:1.2}.edge.dead{stroke-dasharray:5 3}.edge.sfc{stroke:var(--c-sfc);stroke-dasharray:2 3}.edge.addr{stroke:var(--c-addr)}
  .node rect.b{fill:var(--node);stroke:var(--line)}.node text{fill:var(--text);font:11px Segoe UI,Arial,sans-serif}.node text.t{font-weight:600;font-size:12px}.node text.s{fill:var(--muted);font-size:10px}.node text.p{font:10.5px Consolas,monospace}.node line.pl{stroke:var(--muted)}.node.focus rect.b{stroke:var(--accent);stroke-width:2.5}.node.ext rect.b{stroke-dasharray:4 3;fill:var(--panel2)}.etext{fill:var(--muted);font:10px Arial}`;
  const clone=host.cloneNode(true); clone.removeAttribute('transform'); clone.querySelectorAll('.hi,.dim').forEach(x=>x.classList.remove('hi','dim'));
  const svg=`<svg xmlns="${SVGNS}" viewBox="${x0} ${y0} ${x1-x0} ${y1-y0}" width="${x1-x0}" height="${y1-y0}"><style>${css}</style><rect x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" fill="${cs.getPropertyValue('--bg')}"/>${clone.outerHTML}</svg>`;
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'})); a.download=name.replace(/[\\/:*?"<>|]+/g,'_')+'.svg'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

function catOf(b){
  if (!b) return 'ext';
  if (b.kind==='sfc') return 'sfc';
  if (b.kind==='sfci') return 'sfci';
  if (b.kind==='chart') return 'chart';
  const t=b.type||'';
  if (/^(Pcs7|FbAn|FbDi|FbDo|FbAo|MOD_|CH_|PA_|OB_|SUBNET|RACK|PO_UPD|DREP|PADP|DPAY|IM_|PS_|CPU_|PROFI|PN_|PNIO|W_BO|BO_W|DW_BO|BO_DW|W_DW)/i.test(t)) return 'drv';
  if (/^(AND|OR|XOR|NOT|NAND|NOR|And\d|Or\d|R_TRIG|F_TRIG|RS|SR|SEL_|SEL|CMP_|ADD|SUB|MUL|DIV|ABS|MOVE|Add\d|Sub\d*|Mul\d*|Div\d*|MAX|MIN|LIM|ABS_|NEG|SQRT|EXP|LN|SIN|COS|TAN|B_|I_|R_|DI_|DW_|Event|Timer|TON|TOF|TP|CTU|CTD|Counter|Max|Min|Lim|Ge|Gt|Le|Lt|Eq|Ne|Swi|SWI)/.test(t)) return 'logic';

}

function pinUsed(p){ return p.edges.length || p.addrs.length || p.sfc.length; }

async function loadFiles(list){
  const unknown=[];
  for (const f of list){
    const buf = await f.arrayBuffer();
    const text = decodeBuffer(buf);
    const k = detectKind(text);
    if (!k){ unknown.push(f.name); continue; }
    if (k==='hw') TEXTS.hw = (TEXTS.hw||[]).filter(x=>x.fileName!==f.name).concat({text, fileName:f.name});
    else TEXTS[k] = {text, fileName:f.name};
  }
  if (unknown.length) toast('Nerozpoznaný formát: '+unknown.join(', '));
  if (!Object.keys(TEXTS).length) return;
  toast('Zpracovávám…');
  await new Promise(r=>setTimeout(r,20));
  const t0=performance.now();
  M = buildModel(TEXTS);
  toast(`Načteno za ${Math.round(performance.now()-t0)} ms`);
  renderChips(); renderSide();
  if (NAV.view==='files') renderView(); else renderView();
}

/* ---- neighbourhood graph ---- */
const PALETTE=['#2f6db5','#2e8540','#b05a00','#8a3fb8','#0f8a8a','#c0392b','#6b7a00','#b8327a','#4a5bd4','#7a5c3a'];
function buildNeigh(rootId, depth, dir, withAddr, maxN, colorByChart){
  const seen=new Map([[rootId,0]]); let frontier=[rootId]; const E=[];
  const eset=new Set();
  for (let d=1; d<=depth && frontier.length; d++){
    const next=[];
    for (const id of frontier){
      const b=M.blocks.get(id); if(!b) continue;
      const es=[]; if (dir!=='up') es.push(...b.outE.map(e=>[e,e.b])); if (dir!=='down') es.push(...b.inE.map(e=>[e,e.a]));
      for (const [e,o] of es){
        if (!seen.has(o)){ if (seen.size>=maxN) continue; seen.set(o,d); next.push(o); }
        eset.add(e);
      }
    }
    frontier=next;
  }
  // also edges among seen nodes
  for (const id of seen.keys()){ const b=M.blocks.get(id); if(!b) continue; for (const e of b.outE) if (seen.has(e.b)) eset.add(e); }
  const pinsIn=new Map(), pinsOut=new Map();
  const addP=(m,id,p)=>{ (m.get(id)||m.set(id,new Set()).get(id)).add(p); };
  const edges=[];
  for (const e of eset){ addP(pinsOut,e.a,e.ap); addP(pinsIn,e.b,e.bp); edges.push({from:e.a, fp:e.ap, to:e.b, tp:e.bp, dead:e.dead, tip:`${blockFull(M.blocks.get(e.a))}.${e.ap} → ${blockFull(M.blocks.get(e.b))}.${e.bp}${e.dead?' (implicit dead time)':''}`}); }
  const extra=[];
  if (withAddr){
    const root=M.blocks.get(rootId);
    for (const p of root.pins.values()){
      for (const a of p.addrs){
        const out = a.rw.includes('W') && !a.rw.includes('R');
        const nid='addr:'+a.addr+(out?':W':':R');
        if (!extra.some(n=>n.id===nid)) extra.push({id:nid, title:a.addr, sub:a.sym||a.dt, cat:'addr', cls:'addr', small:true, ins:[], outs:[], side: out?'R':'L', ref:{type:'addr', id:a.addr}});
        if (out){ addP(pinsOut,rootId,p.name); edges.push({from:rootId, fp:p.name, to:nid, tp:null, cls:'addr'}); }
        else { addP(pinsIn,rootId,p.name); edges.push({from:nid, fp:null, to:rootId, tp:p.name, cls:'addr'}); }
      }
      const bySfc=new Map(); for (const r of p.sfc){ (bySfc.get(r.sfc)||bySfc.set(r.sfc,new Set()).get(r.sfc)).add(r.rw); }
      for (const [s,rws] of bySfc){
        const w = rws.has('W');
        const nid='sfc:'+s+(w?':W':':R');
        if (!extra.some(n=>n.id===nid)) extra.push({id:nid, title:chartShort(s), sub:'SFC '+(w?'zapisuje':'čte'), cat:'sfc', small:true, ins:[], outs:[], side:w?'L':'R', ref:M.blocks.has(s)?{type:'block',id:s}:null});
        if (w){ addP(pinsIn,rootId,p.name); edges.push({from:nid, fp:null, to:rootId, tp:p.name, cls:'sfc'}); }
        else { addP(pinsOut,rootId,p.name); edges.push({from:rootId, fp:p.name, to:nid, tp:null, cls:'sfc'}); }
      }
    }
  }
  const charts=[...new Set([...seen.keys()].map(id=>M.blocks.get(id)?.chart||id))];
  const chartColor=new Map(charts.map((c,i)=>[c,PALETTE[i%PALETTE.length]]));
  const root=M.blocks.get(rootId);
  const nodes=[...seen.keys()].map(id=>{
    const b=M.blocks.get(id);
    const sameChart = b.chart===root.chart;
    return {id, title:blockTitle(b), sub:(sameChart?'':chartShort(b.chart||'')+' · ')+(b.type||''), cat:catOf(b),
      color: colorByChart ? chartColor.get(b.chart||id) : null,
      ins:[...(pinsIn.get(id)||[])].sort(natCmp), outs:[...(pinsOut.get(id)||[])].sort(natCmp), focus:id===rootId,
      cls: (!colorByChart && !sameChart) ? 'ext' : '', tip:b.id+(b.comment?'\n'+b.comment:''), ref:{type:'block', id}};
  });
  return {nodes:nodes.concat(extra), edges, chartColor};
}

  $('#nlegend').innerHTML = st.color ? [...L.chartColor.entries()].slice(0,30).map(([c,col])=>`<span><i style="background:${col}"></i>${cl(c)}</span>`).join('') : legendCats();
  renderGraph($('#ngraph'), layoutGraph(L.nodes, L.edges, {}), {focus:b.id, fileName:'okoli_'+blockTitle(b), hint:`${L.nodes.length} uzlů · ${L.edges.length} spojení · dvojklik = přejít na blok`,
    onDbl:n=>{ if(n.ref&&n.ref.type==='block') go({view:'neigh', id:n.ref.id, opt:st}); else openNode(n);} });
  const upd = patch => go({view:'neigh', id:b.id, opt:Object.assign({},st,patch)});
  $('#nDepth').onchange=e=>upd({depth:+e.target.value});
  $('#nMax').onchange=e=>upd({max:+e.target.value});
  $('#nAddr').onchange=e=>upd({addr:e.target.checked});
  $('#nCol').onchange=e=>upd({color:e.target.checked});
  $('#nDir').onclick=e=>{ const d=e.target.dataset.d; if(d) upd({dir:d}); };
}
function legendCats(){ return Object.entries(CATNAME).map(([k,l])=>`<span><i style="background:${CATCOL[k]}"></i>${l}</span>`).join('') + '<span>- - - implicit dead time</span>'; }

/* ================= Chart view ================= */
function viewChart(v){
  if (!M) return;
  if (NAV.folder || NAV.id==null || !M.charts.has(NAV.id)) return viewFolder(v, NAV.folder ? (NAV.id||'') : '');
  const c = M.charts.get(NAV.id);
  const st = Object.assign({addr:true, ext:true, sfc:true, iso:true}, NAV.opt||{});
  const B = new Set(c.blocks);
  const nodes=new Map(), edges=[];
  const pinsIn=new Map(), pinsOut=new Map();
  const addP=(m,id,p)=>{ (m.get(id)||m.set(id,new Set()).get(id)).add(p); };
  let nExtIn=0, nExtOut=0;
  for (const id of B){
    const b=M.blocks.get(id);
    for (const e of b.outE){
      if (B.has(e.b)){ addP(pinsOut,id,e.ap); addP(pinsIn,e.b,e.bp); edges.push({from:id,fp:e.ap,to:e.b,tp:e.bp,dead:e.dead,tip:`${b.name}.${e.ap} → ${M.blocks.get(e.b).name}.${e.bp}`}); }
      else { nExtOut++; if (!st.ext) continue; const xid='xo:'+e.b; addP(pinsOut,id,e.ap); addP(pinsIn,xid,e.bp); edges.push({from:id,fp:e.ap,to:xid,tp:e.bp,dead:e.dead,tip:`→ ${e.b}.${e.bp}`}); if(!nodes.has(xid)) nodes.set(xid,{id:xid, ext:e.b, side:'R'}); }
    }
    for (const e of b.inE){
      if (B.has(e.a)) continue;
      nExtIn++; if (!st.ext) continue;
      const xid='xi:'+e.a; addP(pinsIn,id,e.bp); addP(pinsOut,xid,e.ap); edges.push({from:xid,fp:e.ap,to:id,tp:e.bp,dead:e.dead,tip:`${e.a}.${e.ap} →`}); if(!nodes.has(xid)) nodes.set(xid,{id:xid, ext:e.a, side:'L'});
    }
    for (const p of b.pins.values()){
      if (st.addr) for (const a of p.addrs){
        const w = a.rw.includes('W') && !a.rw.includes('R');
        const xid='ad:'+a.addr+(w?':W':':R');
        if (!nodes.has(xid)) nodes.set(xid,{id:xid, addr:a, side:w?'R':'L'});
        if (w){ addP(pinsOut,id,p.name); edges.push({from:id,fp:p.name,to:xid,tp:null,cls:'addr'}); }
        else { addP(pinsIn,id,p.name); edges.push({from:xid,fp:null,to:id,tp:p.name,cls:'addr'}); }
      }
      if (st.sfc){
        const by=new Map(); for (const r of p.sfc) (by.get(r.sfc)||by.set(r.sfc,new Set()).get(r.sfc)).add(r.rw);
        for (const [s,rws] of by){ const w=rws.has('W'); const xid='sf:'+s+(w?':W':':R'); if(!nodes.has(xid)) nodes.set(xid,{id:xid, sfc:s, side:w?'L':'R'});
          if (w){ addP(pinsIn,id,p.name); edges.push({from:xid,fp:null,to:id,tp:p.name,cls:'sfc'}); } else { addP(pinsOut,id,p.name); edges.push({from:id,fp:p.name,to:xid,tp:null,cls:'sfc'}); } }
      }
    }
  }
  const order=new Map();
  const N=[];
  for (const id of B){ const b=M.blocks.get(id); order.set(id, runOrder(b));
    if (!st.iso && !pinsIn.has(id) && !pinsOut.has(id)) continue;
    N.push({id, title:b.name, sub:b.type + (b.comment?' · '+b.comment:''), cat:catOf(b), ins:[...(pinsIn.get(id)||[])].sort(natCmp), outs:[...(pinsOut.get(id)||[])].sort(natCmp), tip:b.id+'\n'+b.type+(b.comment?'\n'+b.comment:''), ref:{type:'block',id}, focus:id===NAV.focus}); }
  for (const x of nodes.values()){
    if (x.ext){ const xb=M.blocks.get(x.ext); N.push({id:x.id, title:blockTitle(xb), sub:chartShort(xb.chart||xb.id), cat:'ext', cls:'ext', side:x.side, ins:[...(pinsIn.get(x.id)||[])].sort(natCmp), outs:[...(pinsOut.get(x.id)||[])].sort(natCmp), tip:xb.id, ref:{type:'block',id:xb.id}}); }
    else if (x.addr){ N.push({id:x.id, title:x.addr.addr, sub:x.addr.sym||x.addr.dt, cat:'addr', cls:'addr', small:true, side:x.side, ins:[], outs:[], ref:{type:'addr', id:x.addr.addr}}); }
    else if (x.sfc){ N.push({id:x.id, title:chartShort(x.sfc), sub:'SFC '+(x.side==='L'?'zapisuje':'čte'), cat:'sfc', cls:'ext', small:true, side:x.side, ins:[], outs:[], ref:M.blocks.has(x.sfc)?{type:'block',id:x.sfc}:null}); }
  }
  v.innerHTML = `<div class="fullv"><div class="toolbar">${crumb(c.path).replace('class="crumb"','class="crumb" style="margin:0"')}
     <span class="flex1"></span>
     <label><input type="checkbox" id="cExt" ${st.ext?'checked':''}> externí (jiné CFC)</label>
     <label><input type="checkbox" id="cAddr" ${st.addr?'checked':''}> adresy</label>
     <label><input type="checkbox" id="cSfc" ${st.sfc?'checked':''}> SFC</label>
     <label><input type="checkbox" id="cIso" ${st.iso?'checked':''}> nenapojené bloky</label></div>
     <div class="toolbar legend">${legendCats()}<span class="flex1"></span><span>${B.size} bloků · ${edges.filter(e=>!String(e.from).includes(':')&&!String(e.to).includes(':')).length} interních spojení · ${nExtIn} vstupů z jiných CFC · ${nExtOut} výstupů do jiných CFC</span></div>
     <div id="cgraph" class="gwrap"></div></div>`;
  if (!M.files.ic) $('#cgraph').insertAdjacentHTML('beforebegin', `<div class="toolbar" style="color:var(--warn)">Bez exportu ${icon('ic')} Block interconnections nejsou vidět propojení.</div>`);
  const upd = patch => go({view:'chart', id:c.path, opt:Object.assign({},st,patch)});
  $('#cExt').onchange=e=>upd({ext:e.target.checked}); $('#cAddr').onchange=e=>upd({addr:e.target.checked}); $('#cSfc').onchange=e=>upd({sfc:e.target.checked}); $('#cIso').onchange=e=>upd({iso:e.target.checked});
  renderGraph($('#cgraph'), layoutGraph(N, edges, {order}), {focus:NAV.focus, fileName:c.name, hint:'Vlevo vstupy z jiných CFC/adres, vpravo výstupy. Dvojklik: blok → detail, externí → jeho CFC.',
    onDbl:n=>{ if (n.cls==='ext' && n.ref && n.ref.type==='block'){ const xb=M.blocks.get(n.ref.id); if (xb.chart) go({view:'chart', id:xb.chart, focus:xb.id}); else go({view:'block', id:xb.id}); } else openNode(n); } });
}

function topChartOf(b){ let cp = b.chart || b.id; let c=M.charts.get(cp); while(c && c.parent){ c=M.charts.get(c.parent); } return c ? c.path : cp; }
function viewFolder(v, fpath){
  const f = M.folderIndex.get(fpath) || M.folderRoot;
  const key = (b)=>{
    const tp = topChartOf(b); const fo = folderOf(tp);
    if (fo===f.path) return 'c:'+tp;
    if (f.path==='' ) return 'f:'+fo.split('\\')[0];
    if (fo.startsWith(f.path+'\\')) return 'f:'+f.path+'\\'+fo.slice(f.path.length+1).split('\\')[0];
    return 'x:'+(fo.split('\\')[0]||tp);
  };
  const agg=new Map(); const nodeSet=new Map();
  for (const sub of f.folders.values()) nodeSet.set('f:'+sub.path,0);
  for (const cp of f.charts) nodeSet.set('c:'+cp,0);
  if (M.files.ic) for (const e of M.edges){
    const ka=key(M.blocks.get(e.a)), kb=key(M.blocks.get(e.b));
    if (ka===kb) continue;
    if (ka.startsWith('x:') && kb.startsWith('x:')) continue;
    const k=ka+'\u0000'+kb; agg.set(k,(agg.get(k)||0)+1);
    if (!nodeSet.has(ka)) nodeSet.set(ka,0); if (!nodeSet.has(kb)) nodeSet.set(kb,0);
  }
  const N=[...nodeSet.keys()].map(k=>{
    const t=k[0], id=k.slice(2);
    if (t==='f'){ const sf=M.folderIndex.get(id); return {id:k, title:id.split('\\').pop(), sub:`složka · ${sf?sf.nCharts:'?'} chartů`, cat:'chart', ins:[], outs:[], ref:{type:'folder',id}}; }
    if (t==='c'){ const c=M.charts.get(id); return {id:k, title:c.name, sub:(c.isSfc?'SFC':'CFC')+` · ${c.blocks.size} bloků`, cat:c.isSfc?'sfc':'tech', ins:[], outs:[], ref:{type:'chart',id}}; }
    return {id:k, title:id, sub:'mimo tuto složku', cat:'ext', cls:'ext', ins:[], outs:[], ref:{type:'folder',id}};
  });
  const pair=new Map();
  for (const [k,n] of agg){ const [a,b]=k.split('\u0000'); const key=a<b?a+'\u0000'+b:b+'\u0000'+a; const x=pair.get(key)||{a,b,ab:0,ba:0}; if (x.a===a) x.ab+=n; else x.ba+=n; pair.set(key,x); }
  const nm=k=>k.slice(2).split('\\').pop();
  const E=[...pair.values()].map(x=>{ const fwd=x.ab>=x.ba; return {from:fwd?x.a:x.b, fp:null, to:fwd?x.b:x.a, tp:null, label:String(x.ab+x.ba), tip:`${nm(x.a)} → ${nm(x.b)}: ${x.ab}\n${nm(x.b)} → ${nm(x.a)}: ${x.ba}`}; });
  v.innerHTML = `<div class="fullv"><div class="toolbar">${folderCrumb(f.path)}<span class="flex1"></span><span class="muted">Přehled: složky a CFC charty v této úrovni, čísla = počet propojení. Dvojklik = otevřít.</span></div>
    <div id="fgraph" class="gwrap"></div></div>`;
  if (!N.length){ $('#fgraph').innerHTML='<div class="empty">Prázdné</div>'; return; }
  renderGraph($('#fgraph'), layoutGraph(N, E, {}), {fileName:'prehled_'+(f.name||'projekt'), onDbl:n=>openNode(n), hint:'dvojklik na složku = zanořit, na chart = otevřít CFC'});
}

function viewSFC(v){
  if (!M) return;

  if (!NAV.id){
    const L=sfcList();
    v.innerHTML = `<div class="pad"><h3>SFC typy a SFC charty</h3><div class="sfcgrid">${L.map(x=> x.kind==='type'
      ? `<div class="sfccard" data-go="sfctype" data-id="${esc(x.id)}">${GI.sfc} <b>${esc(x.name)}</b> <span class="pill">typ</span><div class="muted">${x.ios} používaných I/O · ${x.inst.length} instancí</div>${x.inst.map(b=>`<div class="mono" style="font-size:11px">${esc(chartShort(b.chart))}\\${esc(b.name)}</div>`).join('')}</div>`
      : `<div class="sfccard" data-go="sfci" data-id="${esc(x.id)}">${GI.sfc} <b>${esc(x.name)}</b> <span class="pill">SFC chart</span><div class="muted">${esc(folderOf(x.path))}</div><div class="muted">${x.rows} přístupů do CFC</div></div>`).join('')}</div></div>`;
    return;
  }

    const b=M.blocks.get(NAV.id);

}

function ioStatus(io, b){
  const p = b ? b.pins.get(io.base) : null;
  const conn = p ? (p.edges.length + p.addrs.length + p.sfc.length) : 0;
  const sec = io.section, as = io.assign;
  if (conn) return {k:'ok', t:'napojeno', p};
  if (as==='Timer') return {k:'info', t:'interní timer', p};
  if (as==='(Standard interface)' && sec==='OUT') return {k:'info', t:'std. výstup', p};
  if (as==='Parameter' || as==='Setpoint') return {k:'warn', t:'nenapojeno – hodnota parametru?', p};
  if (sec==='OUT') return {k:'warn', t:'zapisuje se, ale nikam nevede', p};
  return {k:'err', t:'používá se, ale NENÍ napojeno', p};
}
function viewSFCInstance(v, b, t, instList){
  const ios=[...t.ios.values()].sort((x,y)=>natCmp(x.section,y.section)||natCmp(x.base,y.base));

  const cnt = k => rows.filter(r=>r.st.k===k).length;

      ...p.edges.map(e=> e.a===b.id ? '→ '+pinRef(e.b,e.bp,b.chart) : '← '+pinRef(e.a,e.ap,b.chart)),
      ...p.addrs.map(a=>`${al(a.addr)} <span class="muted">${esc(a.sym)}</span>`),

  const usesHtml = io => { const st=io.uses.filter(u=>u.kind==='Step').length, tr=io.uses.filter(u=>u.kind==='Transition').length, sc=io.uses.length-st-tr;
    return `<details class="uses"><summary>${io.uses.length}× <span class="muted">(${st} kroků, ${tr} tranzic${sc?`, ${sc} start/jiné`:''})</span></summary>${io.uses.map(u=>`<div>${esc(u.seq)} · ${esc(u.addr)} <span class="muted">${esc(u.kind)} ${esc(u.rw)}${u.val?' = '+esc(u.val):''}</span></div>`).join('')}</details>`; };
  v.innerHTML = `<div class="pad">
    ${b ? crumb(b.chart, b) : ''}
    <div class="card"><div class="row"><div class="flex1"><h2>${GI.sfc} ${esc(t.name)} ${b?`<span class="muted" style="font-weight:400">instance</span> ${bl(b.id, chartShort(b.chart)+'\\'+b.name)}`:''}</h2>
      <div class="muted">${t.fromAccess?`Zdroj: ${icon('ac')} Accesses in SFC types`:`Zdroj: ${icon('sx')} Cross-References SFC → Chart Element (méně detailů)`}${M.files.ic?'':` · <span style="color:var(--err)">chybí ${icon('ic')} Block interconnections – nelze ověřit napojení</span>`}</div>
      ${instList ? `<div style="margin-top:8px">Vyberte instanci: ${instList.map(x=>`<a class="lnk" data-go="sfci" data-id="${esc(x.id)}">${esc(chartShort(x.chart))}\\${esc(x.name)}</a>`).join(' · ') || '<i>žádná instance v nahraných datech</i>'}</div>`:''}</div>
      ${b?`<div class="row"><button data-go="chart" data-id="${esc(b.chart)}" data-focus="${esc(b.id)}">CFC</button><button data-go="neigh" data-id="${esc(b.id)}">Okolí</button></div>`:''}</div>
      <div class="row" style="margin-top:10px">
        <div class="stat err"><b>${cnt('err')}</b><span>použito, nenapojeno</span></div>
        <div class="stat warn"><b>${cnt('warn')}</b><span>výstup/parametr bez spojení</span></div>
        <div class="stat ok"><b>${cnt('ok')}</b><span>napojeno</span></div>
        <div class="stat"><b>${cnt('info')}</b><span>interní (timery, std.)</span></div>
        ${b?`<div class="stat"><b>${extra.length}</b><span>napojeno, ale v sekvenci nepoužito</span></div>`:''}
      </div></div>
    <div class="row" style="margin-bottom:8px"><span class="seg" id="sfFlt">${[['all','Vše'],['prob','Jen problémy'],['in','IN'],['out','OUT']].map(([k,l])=>`<button data-f="${k}" class="${flt===k?'on':''}">${l}</button>`).join('')}</span>
      <span class="muted">Status vychází z exportů – „napojeno“ = propojení na blok, adresu nebo přístup z jiného SFC.</span></div>
    <div class="tablewrap"><table class="t"><tr><th></th><th>I/O</th><th>Sekce</th><th>Přiřazení</th><th>Charakteristika</th><th>Použití v sekvenci</th><th>${b?'Napojení v CFC':'Status'}</th></tr>
      ${show.map(({io,st})=>`<tr><td><span class="pill ${st.k==='info'?'':st.k}">${esc(st.t)}</span></td><td class="mono nw">${esc(io.name)}</td><td>${esc(io.section)}</td><td>${esc(io.assign)}</td><td>${esc(io.charact)}</td><td>${usesHtml(io)}</td><td>${b?partner(st):''}</td></tr>`).join('')}
    </table></div>

      <div class="tablewrap"><table class="t"><tr><th>Pin</th><th>Směr</th><th>Napojení</th></tr>${extra.map(p=>`<tr><td class="mono">${esc(p.name)}</td><td>${p.dir.toUpperCase()}</td><td>${partner({p})}</td></tr>`).join('')}</table></div>`:''}
  </div>`;
  $('#sfFlt').onclick=e=>{ const f=e.target.dataset.f; if(f) go(Object.assign({},NAV,{flt:f}), false); };
